syntax = "proto3";

package gribcord;

option go_package = "gribcord/v1";

service GribcordService {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
}

message ConnectRequest {
  string client_name = 1;
  uint32 client_version = 2;
}

message ConnectResponse {
  string session_id = 1;
}

message Packet {
  uint32 sequence = 1;
  bytes data = 2;
}
